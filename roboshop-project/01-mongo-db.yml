---
- name: Configure mongodb
  hosts: mongodb
  become: true
  
  tasks:
    - name: Copy mongodb.repo file
      copy:
        src: ~/Ansible-practice/roboshop-project/files/mongodb.repo
        dest: /etc/yum.repos.d/mongodb.repo

    - name: Install Mongodb
      package:
        name: mongodb-org
        state: present

    - name: Update Configuration file to allow other server connections
      replace:
        path: /etc/mongod.conf
        regexp: '^bindIp: 127.0.0.1'
        replace: 'bindIp: 0.0.0.0'

    - name: Start the mongo apiVersion
      service:
        name: mongod
        enabled: true
        state: started