---
- name: Configure and Install user services
  hosts: user
  become: true
  tasks:

    - name: Disable nodejs
      command: dnf module disable nodejs -y

    - name: Enable nodejs 24
      command: dnf module enable nodejs:24 -y

    - name: Install nodejs
      package:
        name: nodejs
        state: present

    - name: Create Application User
      user:
        name: roboshop
        create_home: no
        home: /app
        shell: /sbin/nologin
        comment: "roboshop system user"
        system: true
        state: present

    - name: Remove app directory and file if already present
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /app
        - /tmp/user.zip

    - name: Create application dir
      file:
        name: /app
        state: directory
      
    - name: Download the package
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/user-v4.zip
        dest: /tmp/user.zip

    - name: Unzip the downloaded file
      unarchive:
        src: /tmp/user.zip
        dest: /app
        remote_src: yes

    - name: Install dependencies
      community.general.npm:
        path: /app

    - name: Copy the user service
      copy:
        src: ~/Ansible-practice/roboshop-project/files/user-service.j2
        dest: /etc/systemd/system/user.service

    - name: daemon reload and start the service
      systemcd_service:
        name: user
        state: started
        enabled: true
        daemon_reload: true